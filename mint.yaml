version: 1
name: Resy
slug: resy
summary: >-
  Resy reservation management for Claude — search venues, book tables,
  manage reservations and priority notify
#
# Hosting note (a comment, not user-facing summary text): this is a
# BROWSER-BRIDGE MCP — it reaches its site through the user's signed-in
# tab via the fetchproxy bridge. A bridged registration also needs runtime
# `fly-shared`, `bridge: true` and a `bridgePortEnv`, which are registration
# fields this manifest has no schema for (set them over the control API).
# `state.dataDir` below is required for `bridge`. The port variable to name in
# `bridgePortEnv` is RESY_WS_PORT, declared below.
env:
  - name: RESY_EMAIL
    required: false
    help: >-
      Your Resy account email. Optional — leave unset to use the fetchproxy
      browser bridge instead.
  - name: RESY_PASSWORD
    secret: true
    required: false
    help: >-
      Your Resy account password. Optional — leave unset to use the fetchproxy
      browser bridge instead.
  - name: RESY_AUTH_TOKEN
    secret: true
    required: false
    help: >-
      Pre-obtained x-resy-auth-token. Overrides email/password and the
      fetchproxy bridge. Power users / CI only.
  - name: RESY_DISABLE_FETCHPROXY
    required: false
    help: >-
      Set to '1' to disable the fetchproxy fallback (forces RESY_EMAIL+PASSWORD
      or RESY_AUTH_TOKEN).
  - name: RESY_API_KEY
    secret: true
    required: false
    help: >-
      Override the public web-app API key (rarely needed)
  - name: RESY_TOKEN_CACHE
    required: false
    help: >-
      Set to false to disable the on-disk token cache and mint a new token on
      every process start. Defaults to enabled.
  - name: RESY_TOKEN_FILE
    required: false
    help: >-
      Absolute path for the token cache file. Defaults to
      $MCP_DATA_DIR/.resy-mcp/token.json.
  - name: RESY_WS_PORT
    required: false
    help: >-
      Port for the fetchproxy bridge. The whole fleet shares 37149 (the
      Transporter extension dials it), so override only for local development,
      test isolation, or a hosted bridged registration — this is the variable
      to name in the registration's bridgePortEnv.
state:
  dataDir: true
  reason: >-
    Two things live here. The fetchproxy identity is at
    $HOME/.fetchproxy/identity/<name>.json and the pair code derives from it —
    without a persistent $HOME every cold start mints a fresh identity and
    re-prompts pairing in the browser, and the API refuses bridge without it.
    The minted auth token is cached at $MCP_DATA_DIR/.resy-mcp/token.json
    (0600), which matters most on that same path: with the cache a cold start
    proceeds with no browser present at all. A static RESY_AUTH_TOKEN caches
    nothing.
egress:
  allow:
    # Only hosts the SERVER process actually fetches. Hosts that appear
    # solely in a URL this server BUILDS and returns are excluded.
    - api.resy.com
